<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>问卷 · Surveybox</title>
<style>
  :root{
    --cream:#FAF9F5; --ink:#1A1916; --muted:#6E6A61; --clay:#C96A42;
    --hair:#D9D5C9; --ivory:#F1EFE7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--ink)}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
       font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:48px 22px 150px}
  .mark{width:56px;height:3px;background:var(--clay);margin-bottom:26px}
  .kicker{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  h1{font-family:Georgia,"Songti SC","宋体",serif;font-weight:400;font-size:34px;
     letter-spacing:.02em;margin:10px 0 12px;line-height:1.35}
  .intro{color:var(--muted);font-size:14px;max-width:600px}
  hr{border:0;border-top:1px solid var(--hair);margin:32px 0}
  .q{margin:0 0 30px}
  .q .no{font-family:Georgia,"宋体",serif;color:var(--clay);font-size:12px;
         letter-spacing:.1em;margin-right:8px}
  .q .t{font-size:16.5px;line-height:1.55}
  .q .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .q .body{margin-top:12px}
  label.opt{display:flex;align-items:flex-start;gap:11px;padding:12px 2px;cursor:pointer}
  label.opt:active{background:var(--ivory)}
  label.opt input{margin:4px 0 0;accent-color:var(--clay);width:17px;height:17px;flex:0 0 auto}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale label{display:flex;flex-direction:column;align-items:center;justify-content:center;
               gap:3px;min-height:62px;border:1px solid var(--hair);background:#fff;
               cursor:pointer;font-size:11px;color:var(--muted);padding:6px 2px;transition:.12s}
  .scale label b{font-family:Georgia,serif;font-size:19px;font-weight:400;color:var(--ink)}
  .scale label.sel{background:var(--clay);border-color:var(--clay);color:#fff}
  .scale label.sel b{color:#fff}
  textarea{width:100%;min-height:88px;border:1px solid var(--hair);background:#fff;
           padding:12px;font:inherit;color:inherit;resize:vertical;border-radius:0}
  textarea:focus{outline:2px solid rgba(201,106,66,.22)}
  .btnbar{position:fixed;left:0;right:0;bottom:0;background:rgba(250,249,245,.96);
          border-top:1px solid var(--hair);padding:12px 22px calc(12px + env(safe-area-inset-bottom))}
  .btnbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
  button{flex:1;background:var(--clay);color:#fff;border:0;padding:15px 24px;
         font-size:16px;letter-spacing:.06em;cursor:pointer;font-family:inherit}
  button:active{background:#B55B3D}
  button:disabled{opacity:.45}
  .meter{font-size:12px;color:var(--muted);white-space:nowrap}
  .done{display:none;padding-top:20px}
  .done .badge{display:inline-block;font-size:11px;letter-spacing:.18em;color:var(--clay);
               border:1px solid var(--clay);padding:4px 10px;margin-bottom:18px}
  .done h2{font-family:Georgia,"宋体",serif;font-weight:400;font-size:30px;margin:0 0 8px}
  footer{margin-top:44px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--hair);
         padding-top:14px}
  @media (max-width:460px){
    .wrap{padding:32px 18px 160px}
    h1{font-size:27px}
    .scale{gap:4px}
    .scale label{font-size:10px;min-height:58px}
    .scale label b{font-size:17px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"></div>
  <div class="kicker">问卷 · SURVEY</div>
  <h1 id="title">加载中…</h1>
  <p class="intro" id="intro"></p>
  <hr>
  <form id="form"></form>
  <div class="done" id="done">
    <div class="badge">已提交</div>
    <h2>谢谢你的参与。</h2>
    <p class="intro">你的回答已计入统计，可以关闭本页。</p>
    <p><a href="/dashboard" style="color:#C96A42">查看统计看板 →</a></p>
  </div>
  <footer>数据仅保存在本机 ｜ <a href="/dashboard" style="color:#6E6A61">统计看板</a></footer>
</div>

<div class="btnbar" id="bar">
  <div class="in">
    <span class="meter" id="meter">0 / 0</span>
    <button id="submit" type="button">提交问卷</button>
  </div>
</div>

<script>
let SURVEY = {questions: []};
const answers = {};

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function render(){
  const form = document.getElementById("form");
  form.innerHTML = "";
  SURVEY.questions.forEach((q, i) => {
    const box = el("div", "q");
    const tag = q.required ? "" : '<span style="color:var(--muted);font-size:12.5px">（选填）</span>';
    box.appendChild(el("div", "t",
      `<span class="no">${String(i+1).padStart(2,"0")}</span>${q.title}${tag}`));
    if(q.hint) box.appendChild(el("div","hint",q.hint));
    const body = el("div","body");

    if(q.type === "scale"){
      const wrap = el("div","scale");
      const top = q.scale_max || 5;
      for(let v=1; v<=top; v++){
        const lab = el("label", "", `<b>${v}</b>${(q.labels||[])[v-1]||""}`);
        lab.onclick = () => {
          wrap.querySelectorAll("label").forEach(x=>x.classList.remove("sel"));
          lab.classList.add("sel");
          answers[q.id] = v; meter();
        };
        wrap.appendChild(lab);
      }
      body.appendChild(wrap);

    } else if(q.type === "multi"){
      q.options.forEach(o=>{
        const lab = el("label","opt",`<input type="checkbox" value="${o}"><span>${o}</span>`);
        const cb = lab.querySelector("input");
        cb.onchange = () => {
          const picked = [...body.querySelectorAll("input:checked")];
          if(q.max && picked.length > q.max){ cb.checked = false; return; }
          answers[q.id] = picked.map(x=>x.value);
          meter();
        };
        body.appendChild(lab);
      });

    } else if(q.type === "text"){
      const ta = el("textarea");
      ta.placeholder = q.hint || "可以留空";
      ta.oninput = () => { answers[q.id] = ta.value.trim(); meter(); };
      body.appendChild(ta);

    } else {
      q.options.forEach(o=>{
        const lab = el("label","opt",`<input type="radio" name="${q.id}" value="${o}"><span>${o}</span>`);
        lab.querySelector("input").onchange = () => { answers[q.id] = o; meter(); };
        body.appendChild(lab);
      });
    }
    box.appendChild(body);
    form.appendChild(box);
  });
  meter();
}

function meter(){
  const req = SURVEY.questions.filter(q=>q.required);
  const done = req.filter(q=>{
    const v = answers[q.id];
    return Array.isArray(v) ? v.length>0 : (v !== undefined && v !== "" && v !== null);
  }).length;
  document.getElementById("meter").textContent = `${done} / ${req.length}`;
}

async function boot(){
  const r = await fetch("/api/survey");
  SURVEY = await r.json();
  document.getElementById("title").textContent = SURVEY.title || "问卷";
  document.getElementById("intro").textContent = SURVEY.intro || "";
  document.title = (SURVEY.title||"问卷") + " · Surveybox";
  render();
}

document.getElementById("submit").onclick = async () => {
  const req = SURVEY.questions.filter(q=>q.required);
  const missing = req.filter(q=>{
    const v = answers[q.id];
    return Array.isArray(v) ? v.length===0 : (v===undefined || v==="");
  });
  if(missing.length){
    alert("还有 " + missing.length + " 题没答：\n" + missing.map(q=>q.title).join("\n"));
    return;
  }
  const btn = document.getElementById("submit");
  btn.disabled = true; btn.textContent = "提交中…";
  try{
    const r = await fetch("/api/submit", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(answers)
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.missing ? "缺少必答题" : (j.error||("HTTP "+r.status)));
    document.getElementById("form").style.display = "none";
    document.getElementById("bar").style.display = "none";
    document.getElementById("done").style.display = "block";
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){
    btn.disabled = false; btn.textContent = "提交问卷";
    alert("提交失败：" + e.message);
  }
};

boot();
</script>
</body>
</html>
